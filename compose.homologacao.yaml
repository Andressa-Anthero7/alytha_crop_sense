services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.homologacao
    ports:
      - "127.0.0.1:8765:8765"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/health',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
  analytical-worker:
    build:
      context: .
      dockerfile: Dockerfile.homologacao
    command: ["python", "-m", "app.analysis_worker"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
